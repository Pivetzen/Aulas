<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Professor - Acesso Restrito</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
    <style>
        .progress-bar { transition: width 1s ease-in-out; }
        .dot { transition: all 0.3s ease-in-out; }
        input:checked ~ .dot { transform: translateX(100%); background-color: #ef4444; }
        input:checked ~ .block { background-color: #fee2e2; border-color: #fca5a5; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8 font-sans">

    <!-- TELA DE BLOQUEIO / LOGIN INICIAL -->
    <div id="tela-bloqueio" class="min-h-[85vh] flex items-center justify-center">
        <div class="bg-white rounded-2xl max-w-sm w-full p-8 shadow-md border border-gray-200 text-center">
            <div class="w-12 h-12 bg-slate-900 text-white rounded-2xl flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h1 class="text-xl font-extrabold text-slate-800">Portal do Professor</h1>
            <p class="text-xs text-slate-500 mt-1 mb-6">Acesso restrito ao administrador.</p>

            <input
                type="password"
                id="input-senha-inicial"
                placeholder="Digite a senha de admin"
                class="w-full px-4 py-3 rounded-xl border border-slate-200 mb-3 focus:outline-none focus:border-blue-500 text-sm text-center"
                onkeydown="if(event.key==='Enter') autenticarAdmin()"
            >
            <button
                id="btn-entrar-inicial"
                onclick="autenticarAdmin()"
                class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs uppercase tracking-wider py-3 rounded-xl shadow-sm transition-all"
            >
                Acessar Painel
            </button>
            <p id="msg-erro-login" class="text-red-500 text-xs font-semibold mt-3 hidden"></p>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL (OCULTO ATÉ AUTENTICAR) -->
    <div id="app-conteudo" class="hidden max-w-6xl mx-auto">
        <!-- Cabeçalho -->
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4 bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
            <div>
                <div class="flex items-center gap-3">
                    <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">Portal de Reforço</h1>
                    <span class="bg-amber-100 text-amber-800 text-[10px] font-black uppercase px-2.5 py-1 rounded-full tracking-wider border border-amber-300">Admin</span>
                </div>
                <p class="text-slate-500 text-sm font-medium">Gestão Pedagógica e Financeira</p>
            </div>

            <div class="flex flex-wrap items-center gap-3">
                <div class="flex items-center bg-slate-50 px-4 py-2 rounded-xl border border-slate-200">
                    <label class="mr-3 font-semibold text-slate-600 uppercase text-[10px] tracking-wider">Aluno:</label>
                    <select id="select-aluno" onchange="renderizarDados()" class="bg-transparent border-none focus:ring-0 text-blue-600 font-bold cursor-pointer text-base outline-none">
                        <option value="TODOS">📋 Todos os Alunos</option>
                    </select>
                </div>

                <button onclick="abrirModalAula()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs uppercase tracking-wider px-4 py-2.5 rounded-xl shadow-sm transition-all flex items-center gap-2">
                    + Nova Aula
                </button>

                <button onclick="bloquearPainel()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold text-xs uppercase tracking-wider px-3 py-2.5 rounded-xl transition-all">
                    Sair
                </button>
            </div>
        </div>

        <!-- Grid Principal -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div id="coluna-evolucao" class="hidden lg:col-span-1">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 h-full">
                    <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center"><span class="w-2 h-6 bg-blue-500 rounded mr-2"></span>Evolução</h2>
                    <div id="container-progresso" class="space-y-6"></div>
                </div>
            </div>

            <div id="coluna-aulas" class="lg:col-span-3">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-6 gap-4">
                        <h2 class="text-xl font-bold text-gray-800 flex items-center"><span class="w-2 h-6 bg-green-500 rounded mr-2"></span>Histórico de Aulas</h2>
                        
                        <div class="flex items-center gap-3 flex-wrap">
                            <label class="flex items-center cursor-pointer select-none text-sm">
                                <span class="mr-2 font-bold text-slate-600 text-xs">Pendentes</span>
                                <div class="relative">
                                    <input type="checkbox" id="check-pendentes" onchange="renderizarDados()" class="sr-only">
                                    <div class="block bg-gray-200 w-10 h-6 rounded-full border border-gray-300"></div>
                                    <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full shadow"></div>
                                </div>
                            </label>

                            <div class="flex items-center bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5">
                                <span class="text-slate-400 text-xs font-bold mr-1">R$</span>
                                <input type="number" id="valor-hora" placeholder="Valor/h" min="0" step="0.01" class="bg-transparent text-xs font-bold text-slate-700 w-16 outline-none border-none p-0 focus:ring-0" />
                            </div>

                            <label class="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs px-3 py-2 rounded-xl border border-slate-200 transition-all flex items-center gap-1.5" title="Incluir logomarca no PDF">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                                <span id="label-logo">Logo PDF</span>
                                <input type="file" id="input-logo" accept="image/png, image/jpeg" onchange="carregarLogo(event)" class="hidden" />
                            </label>

                            <button onclick="gerarPDF()" class="bg-red-500 hover:bg-red-600 text-white font-bold text-xs uppercase tracking-wider px-4 py-2 rounded-xl shadow-sm transition-all flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                </svg>
                                PDF Pendentes
                            </button>
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm text-slate-600">
                            <thead>
                                <tr class="text-slate-400 uppercase text-[10px] tracking-widest border-b border-slate-100">
                                    <th class="py-4 px-2">Data</th>
                                    <th id="th-aluno" class="py-4 px-2">Aluno</th>
                                    <th class="py-4 px-2">Conteúdo</th>
                                    <th class="py-4 px-2 text-center">Horas</th>
                                    <th class="py-4 px-2 text-right">Status</th>
                                    <th class="py-4 px-2 text-right">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-aulas" class="divide-y divide-slate-50"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Cadastrar / Remarcar / Editar Aula -->
    <div id="modal-aula" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-gray-100">
            <h3 id="titulo-modal-aula" class="text-lg font-extrabold text-slate-800 mb-4">Nova Aula</h3>
            <input type="hidden" id="edit-row-index">
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Aluno</label>
                    <input type="text" id="form-aluno" list="lista-alunos-datalist" placeholder="Nome do aluno" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-blue-500">
                    <datalist id="lista-alunos-datalist"></datalist>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Data</label>
                        <input type="date" id="form-data" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Duração (Horas)</label>
                        <input type="number" id="form-horas" step="0.5" min="0.5" value="1.5" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Conteúdo / Disciplina</label>
                    <input type="text" id="form-conteudo" placeholder="Ex: Matemática: Funções..." class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-blue-500">
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="form-pago" class="w-4 h-4 text-blue-600 rounded border-gray-300">
                    <label for="form-pago" class="text-sm font-semibold text-slate-700">Aula já está paga</label>
                </div>
            </div>

            <div class="flex justify-end gap-2 mt-6">
                <button onclick="fecharModalAula()" class="px-4 py-2 text-xs font-bold text-slate-500 hover:bg-slate-100 rounded-xl">Cancelar</button>
                <button id="btn-salvar-aula" onclick="salvarAula()" class="px-5 py-2 text-xs font-bold bg-blue-600 text-white hover:bg-blue-700 rounded-xl flex items-center gap-2">Salvar Aula</button>
            </div>
        </div>
    </div>

    <script>
        const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbwpH_DJjASM67i0iU2oEXQU62eDOaGAyOFnlWKuCWxabDNlkEc4Ogn2SSKDw5pejtMQfQ/exec';

        let dadosGlobais = [];
        let senhaAdminAtual = '';
        let logoBase64 = localStorage.getItem('portal_professor_logo') || null;
        let intervaloAtualizacao = null;

        if (logoBase64) {
            document.getElementById('label-logo').innerText = 'Logo Salva ✓';
        }

        function formatarDataBR(valor) {
            if (!valor) return "";
            const str = String(valor).trim();

            if (/^\d{2}\/\d{2}\/\d{4}$/.test(str)) {
                return str;
            }

            const matchISO = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (matchISO) {
                return `${matchISO[3]}/${matchISO[2]}/${matchISO[1]}`;
            }

            const dataObj = new Date(str);
            if (!isNaN(dataObj.getTime())) {
                const dia = String(dataObj.getDate()).padStart(2, "0");
                const mes = String(dataObj.getMonth() + 1).padStart(2, "0");
                const ano = dataObj.getFullYear();
                return `${dia}/${mes}/${ano}`;
            }

            return str;
        }

        function mostrarErroLogin(texto) {
            const el = document.getElementById('msg-erro-login');
            el.innerText = texto;
            el.classList.remove('hidden');
        }

        async function autenticarAdmin() {
            const senha = document.getElementById('input-senha-inicial').value.trim();
            if (!senha) return mostrarErroLogin('Informe a senha de administrador.');

            if (URL_APPS_SCRIPT.includes('COLE_SUA_URL')) {
                return mostrarErroLogin('Configure a URL_APPS_SCRIPT no código.');
            }

            const btn = document.getElementById('btn-entrar-inicial');
            btn.innerText = 'Verificando...';
            btn.disabled = true;
            document.getElementById('msg-erro-login').classList.add('hidden');

            try {
                const res = await fetch(URL_APPS_SCRIPT, {
                    method: 'POST',
                    body: JSON.stringify({ acao: 'listar', senha: senha })
                });
                const json = await res.json();

                if (json.status === 'sucesso') {
                    senhaAdminAtual = senha;
                    dadosGlobais = json.dados || [];

                    document.getElementById('tela-bloqueio').classList.add('hidden');
                    document.getElementById('app-conteudo').classList.remove('hidden');
                    document.getElementById('input-senha-inicial').value = '';

                    popularMenuAlunos();
                    renderizarDados();

                    if (intervaloAtualizacao) clearInterval(intervaloAtualizacao);
                    intervaloAtualizacao = setInterval(() => carregarDados(true), 180000);
                } else {
                    mostrarErroLogin(json.mensagem || 'Senha incorreta.');
                }
            } catch (err) {
                mostrarErroLogin('Erro ao conectar com o servidor.');
                console.error(err);
            } finally {
                btn.innerText = 'Acessar Painel';
                btn.disabled = false;
            }
        }

        function bloquearPainel() {
            senhaAdminAtual = '';
            dadosGlobais = [];
            if (intervaloAtualizacao) clearInterval(intervaloAtualizacao);
            document.getElementById('app-conteudo').classList.add('hidden');
            document.getElementById('tela-bloqueio').classList.remove('hidden');
            document.getElementById('msg-erro-login').classList.add('hidden');
            document.getElementById('input-senha-inicial').focus();
        }

        async function carregarDados(silencioso = false) {
            if (!senhaAdminAtual) return;
            try {
                const res = await fetch(URL_APPS_SCRIPT, {
                    method: 'POST',
                    body: JSON.stringify({ acao: 'listar', senha: senhaAdminAtual })
                });
                const json = await res.json();
                if (json.status === 'sucesso') {
                    dadosGlobais = json.dados || [];
                    popularMenuAlunos();
                    renderizarDados();
                } else if (!silencioso) {
                    alert('Sessão inválida. Faça login novamente.');
                    bloquearPainel();
                }
            } catch (e) {
                console.error('Erro ao atualizar dados:', e);
            }
        }

        function popularMenuAlunos() {
            const select = document.getElementById('select-aluno');
            const datalist = document.getElementById('lista-alunos-datalist');
            const alunosUnicos = [...new Set(dadosGlobais.map(d => d.aluno))].sort();
            const valorAtual = select.value;

            let optionsHTML = `<option value="TODOS" ${valorAtual === 'TODOS' ? 'selected' : ''}>📋 Todos os Alunos</option>`;
            optionsHTML += alunosUnicos.map(nome => `<option value="${nome}" ${nome === valorAtual ? 'selected' : ''}>${nome}</option>`).join('');

            select.innerHTML = optionsHTML;
            datalist.innerHTML = alunosUnicos.map(nome => `<option value="${nome}">`).join('');

            if (valorAtual && valorAtual !== 'TODOS' && !alunosUnicos.includes(valorAtual)) {
                select.value = 'TODOS';
            }
        }

        function renderizarDados() {
            const selecionado = document.getElementById('select-aluno').value;
            const apenasPendentes = document.getElementById('check-pendentes').checked;
            const cProgresso = document.getElementById('container-progresso');
            const tAulas = document.getElementById('tabela-aulas');

            const colEvolucao = document.getElementById('coluna-evolucao');
            const colAulas = document.getElementById('coluna-aulas');
            const thAluno = document.getElementById('th-aluno');

            if (selecionado === 'TODOS') {
                colEvolucao.classList.add('hidden');
                colAulas.classList.replace('lg:col-span-2', 'lg:col-span-3');
                thAluno.classList.remove('hidden');
            } else {
                colEvolucao.classList.remove('hidden');
                colAulas.classList.replace('lg:col-span-3', 'lg:col-span-2');
                thAluno.classList.add('hidden');
            }

            cProgresso.innerHTML = '';
            tAulas.innerHTML = '';

            const dadosFiltrados = selecionado === 'TODOS'
                ? dadosGlobais
                : dadosGlobais.filter(d => d.aluno === selecionado);

            dadosFiltrados.forEach(i => {
                if (i.tipo === 'Progresso' && selecionado !== 'TODOS') {
                    const p = parseInt(i.valor) || 0;
                    cProgresso.innerHTML += `<div>
                        <div class="flex justify-between text-xs mb-2 font-bold text-slate-700"><span>${i.conteudo}</span><span>${p}%</span></div>
                        <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                            <div class="bg-blue-500 h-2.5 rounded-full progress-bar" style="width:${p}%"></div>
                        </div>
                    </div>`;
                } else if (i.tipo === 'Aula') {
                    if (apenasPendentes && i.pago) return;

                    const dataFormatada = formatarDataBR(i.valor);
                    const aulaJson = encodeURIComponent(JSON.stringify(i));

                    tAulas.innerHTML += `<tr class="hover:bg-slate-50 transition-colors">
                        <td class="py-4 px-2 text-slate-500 font-medium whitespace-nowrap">${dataFormatada}</td>
                        ${selecionado === 'TODOS' ? `<td class="py-4 px-2 font-bold text-blue-600 whitespace-nowrap">${i.aluno}</td>` : ''}
                        <td class="py-4 px-2 font-semibold text-slate-800">${i.conteudo}</td>
                        <td class="py-4 px-2 text-center font-bold text-slate-500">${i.extra}h</td>
                        <td class="py-4 px-2 text-right">
                            <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider ${i.pago ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                                ${i.pago ? 'Pago' : 'Pendente'}
                            </span>
                        </td>
                        <td class="py-4 px-2 text-right whitespace-nowrap">
                            <button onclick="abrirModalEditar('${aulaJson}')" class="text-blue-600 hover:text-blue-800 font-bold text-xs mr-2" title="Editar / Remarcar">Editar</button>
                            <button onclick="cancelarAula(${i.rowIndex}, '${i.aluno}', '${dataFormatada}')" class="text-red-500 hover:text-red-700 font-bold text-xs" title="Cancelar / Excluir">Cancelar</button>
                        </td>
                    </tr>`;
                }
            });
        }

        function abrirModalAula() {
            document.getElementById('titulo-modal-aula').innerText = 'Cadastrar Nova Aula';
            document.getElementById('edit-row-index').value = '';
            const alunoAtual = document.getElementById('select-aluno').value;
            document.getElementById('form-aluno').value = alunoAtual !== 'TODOS' ? alunoAtual : '';
            document.getElementById('form-data').value = new Date().toISOString().split('T')[0];
            document.getElementById('form-horas').value = '1.5';
            document.getElementById('form-conteudo').value = '';
            document.getElementById('form-pago').checked = false;
            document.getElementById('modal-aula').classList.remove('hidden');
        }

        function abrirModalEditar(aulaEncoded) {
            const aula = JSON.parse(decodeURIComponent(aulaEncoded));
            document.getElementById('titulo-modal-aula').innerText = 'Editar / Remarcar Aula';
            document.getElementById('edit-row-index').value = aula.rowIndex;
            document.getElementById('form-aluno').value = aula.aluno;

            const dataFormatada = formatarDataBR(aula.valor);
            const partes = dataFormatada.split('/');
            if (partes.length === 3) {
                document.getElementById('form-data').value = `${partes[2]}-${partes[1]}-${partes[0]}`;
            }

            document.getElementById('form-horas').value = aula.extra;
            document.getElementById('form-conteudo').value = aula.conteudo;
            document.getElementById('form-pago').checked = aula.pago;
            document.getElementById('modal-aula').classList.remove('hidden');
        }

        function fecharModalAula() {
            document.getElementById('modal-aula').classList.add('hidden');
        }

        async function salvarAula() {
            const rowIndex = document.getElementById('edit-row-index').value;
            const aluno = document.getElementById('form-aluno').value.trim();
            const dataISO = document.getElementById('form-data').value;
            const horas = document.getElementById('form-horas').value;
            const conteudo = document.getElementById('form-conteudo').value.trim();
            const pago = document.getElementById('form-pago').checked;

            if (!aluno || !dataISO || !conteudo) {
                return alert('Preencha Aluno, Data e Conteúdo.');
            }

            const [ano, mes, dia] = dataISO.split('-');
            const dataBR = `${dia}/${mes}/${ano}`;

            const btn = document.getElementById('btn-salvar-aula');
            btn.innerText = 'Salvando...';
            btn.disabled = true;

            try {
                const payload = {
                    senha: senhaAdminAtual,
                    acao: rowIndex ? 'editar' : 'cadastrar',
                    rowIndex: rowIndex,
                    aluno: aluno,
                    data: dataBR,
                    horas: horas,
                    conteudo: conteudo,
                    pago: pago
                };

                const res = await fetch(URL_APPS_SCRIPT, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const json = await res.json();

                if (json.status === 'sucesso') {
                    alert(json.mensagem);
                    fecharModalAula();
                    await carregarDados(true);
                } else {
                    alert('Erro: ' + json.mensagem);
                }
            } catch (err) {
                alert('Erro de comunicação com a planilha.');
                console.error(err);
            } finally {
                btn.innerText = 'Salvar Aula';
                btn.disabled = false;
            }
        }

        async function cancelarAula(rowIndex, aluno, data) {
            if (!confirm(`Deseja realmente cancelar/excluir a aula de ${aluno} do dia ${data}?`)) return;

            try {
                const res = await fetch(URL_APPS_SCRIPT, {
                    method: 'POST',
                    body: JSON.stringify({
                        senha: senhaAdminAtual,
                        acao: 'excluir',
                        rowIndex: rowIndex
                    })
                });
                const json = await res.json();

                if (json.status === 'sucesso') {
                    alert(json.mensagem);
                    await carregarDados(true);
                } else {
                    alert('Erro: ' + json.mensagem);
                }
            } catch (err) {
                alert('Erro ao cancelar aula.');
            }
        }

        function carregarLogo(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                logoBase64 = e.target.result;
                localStorage.setItem('portal_professor_logo', logoBase64);
                document.getElementById('label-logo').innerText = 'Logo Salva ✓';
            };
            reader.readAsDataURL(file);
        }

        function gerarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            const alunoSelecionado = document.getElementById('select-aluno').value;
            if (!alunoSelecionado || alunoSelecionado === 'TODOS') {
                return alert("Selecione um aluno específico no menu superior para gerar o PDF.");
            }

            const valorHoraInput = document.getElementById('valor-hora').value;
            const valorHora = parseFloat(valorHoraInput) || 0;

            const aulasPendentes = dadosGlobais.filter(d => d.aluno === alunoSelecionado && d.tipo === 'Aula' && !d.pago);

            if (aulasPendentes.length === 0) {
                alert(`Não há aulas pendentes para o aluno ${alunoSelecionado}.`);
                return;
            }

            const totalHoras = aulasPendentes.reduce((acc, curr) => acc + (parseFloat(curr.extra) || 0), 0);
            const valorTotalDevido = totalHoras * valorHora;

            if (logoBase64) {
                doc.addImage(logoBase64, 'PNG', 160, 12, 35, 18);
            } else {
                doc.setDrawColor(220, 220, 220);
                doc.rect(160, 12, 35, 18);
                doc.setFontSize(8);
                doc.setTextColor(180, 180, 180);
                doc.text("Sua Logo", 171, 22);
                doc.setTextColor(0, 0, 0);
            }

            doc.setFont("helvetica", "bold");
            doc.setFontSize(18);
            doc.text("Relatório de Aulas Pendentes", 14, 20);

            doc.setFontSize(11);
            doc.setFont("helvetica", "normal");
            doc.text(`Aluno: ${alunoSelecionado}`, 14, 28);
            doc.text(`Data de Emissão: ${new Date().toLocaleDateString('pt-BR')}`, 14, 34);

            if (valorHora > 0) {
                doc.text(`Valor da Hora-Aula: R$ ${valorHora.toFixed(2).replace('.', ',')}`, 14, 40);
            }

            const tableRows = aulasPendentes.map(aula => [
                formatarDataBR(aula.valor),
                aula.conteudo,
                `${aula.extra}h`,
                "Pendente"
            ]);

            doc.autoTable({
                startY: valorHora > 0 ? 48 : 44,
                head: [['Data', 'Conteúdo', 'Horas', 'Status']],
                body: tableRows,
                headStyles: { fillColor: [239, 68, 68] },
                theme: 'striped',
                margin: { left: 14, right: 14 }
            });

            let finalY = doc.lastAutoTable.finalY + 12;
            doc.setFont("helvetica", "bold");
            doc.setFontSize(11);

            doc.text(`Total de Horas Pendentes: ${totalHoras}h`, 14, finalY);

            if (valorHora > 0) {
                finalY += 6;
                doc.setFontSize(13);
                doc.setTextColor(185, 28, 28);
                doc.text(`Valor Total Pendente: R$ ${valorTotalDevido.toFixed(2).replace('.', ',')}`, 14, finalY);
            }

            doc.save(`Relatorio_Financeiro_${alunoSelecionado.replace(/\s+/g, '_')}.pdf`);
        }
    </script>
</body>
</html>
